<!doctype html>
<html><head><meta charset="utf-8"><title>作り方動画</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script>
// 文字入れさん「作り方」動画：すべてコードで描くアニメーション。
// window.setup(timeline) のあと window.frame(t, amp) で t 秒の絵を描き、JPEG を返す。
const cv = document.getElementById('c');
const g = cv.getContext('2d');
const W = 1920, H = 1080;
const C = {
  bg: '#1d1c1a', bg2: '#262522', panel: '#2f2d29', line: '#45423c', text: '#f4f1e8', dim: '#a8a397',
  orange: '#d97757', orange2: '#e9a284', green: '#7cc47f', red: '#e46a6a', blue: '#6aaeea', yellow: '#e8c26a',
  paper: '#fbfaf5', ink: '#33312c', purple: '#b48ee8',
};
const UI = '"BIZ UDPGothic","Yu Gothic UI","Meiryo",sans-serif';
const MONO = '"BIZ UDGothic","Consolas",monospace';

// ---------- 小道具 ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const eo = (x) => 1 - Math.pow(1 - clamp(x), 3);
const eio = (x) => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const prog = (v, a, b) => clamp((v - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;

function rr(x, y, w, h, r, fill, stroke, lw = 3) {
  g.beginPath(); g.roundRect(x, y, w, h, r);
  if (fill) { g.fillStyle = fill; g.fill(); }
  if (stroke) { g.strokeStyle = stroke; g.lineWidth = lw; g.stroke(); }
}
function txt(s, x, y, size, color = C.text, align = 'left', font = UI, weight = '700') {
  g.font = `${weight} ${size}px ${font}`; g.fillStyle = color; g.textAlign = align; g.textBaseline = 'middle';
  g.fillText(s, x, y);
}
function tw(s, size, font = UI, weight = '700') { g.font = `${weight} ${size}px ${font}`; return g.measureText(s).width; }
// 透明度と下からの出現
function appear(k, fn, dy = 24) {
  if (k <= 0) return;
  g.save(); g.globalAlpha *= clamp(k); g.translate(0, (1 - eo(k)) * dy); fn(); g.restore();
}
function pop(k, cx, cy, fn) {
  if (k <= 0) return;
  const s = k < 1 ? 0.6 + 0.4 * eo(k) + Math.sin(clamp(k) * Math.PI) * 0.08 : 1;
  g.save(); g.globalAlpha *= clamp(k * 1.5); g.translate(cx, cy); g.scale(s, s); g.translate(-cx, -cy); fn(); g.restore();
}
function check(x, y, r, k = 1, color = C.green) {
  if (k <= 0) return;
  g.save(); g.globalAlpha *= clamp(k * 2);
  g.beginPath(); g.arc(x, y, r, 0, 7); g.fillStyle = color; g.fill();
  g.strokeStyle = C.bg; g.lineWidth = r * 0.28; g.lineCap = 'round'; g.lineJoin = 'round';
  const p = eo(k); g.beginPath(); g.moveTo(x - r * .45, y + r * .02);
  const mx = x - r * .12, my = y + r * .35, ex = x + r * .48, ey = y - r * .35;
  if (p < .4) g.lineTo(lerp(x - r * .45, mx, p / .4), lerp(y, my, p / .4));
  else { g.lineTo(mx, my); g.lineTo(lerp(mx, ex, (p - .4) / .6), lerp(my, ey, (p - .4) / .6)); }
  g.stroke(); g.restore();
}
function cross(x, y, r, k = 1, color = C.red) {
  if (k <= 0) return;
  g.save(); g.globalAlpha *= clamp(k * 2);
  g.beginPath(); g.arc(x, y, r, 0, 7); g.fillStyle = color; g.fill();
  g.strokeStyle = C.bg; g.lineWidth = r * 0.28; g.lineCap = 'round';
  const p = eo(k), d = r * .38;
  g.beginPath(); g.moveTo(x - d, y - d); g.lineTo(x - d + 2 * d * clamp(p * 2), y - d + 2 * d * clamp(p * 2));
  if (p > .5) { g.moveTo(x + d, y - d); g.lineTo(x + d - 2 * d * clamp(p * 2 - 1), y - d + 2 * d * clamp(p * 2 - 1)); }
  g.stroke(); g.restore();
}
function arrow(x1, y1, x2, y2, k = 1, color = C.dim, lw = 5) {
  if (k <= 0) return;
  const p = eo(k), ex = lerp(x1, x2, p), ey = lerp(y1, y2, p), a = Math.atan2(y2 - y1, x2 - x1);
  g.save(); g.strokeStyle = color; g.fillStyle = color; g.lineWidth = lw; g.lineCap = 'round';
  g.beginPath(); g.moveTo(x1, y1); g.lineTo(ex - Math.cos(a) * 8, ey - Math.sin(a) * 8); g.stroke();
  g.beginPath(); g.moveTo(ex, ey); g.lineTo(ex - 22 * Math.cos(a - .45), ey - 22 * Math.sin(a - .45));
  g.lineTo(ex - 22 * Math.cos(a + .45), ey - 22 * Math.sin(a + .45)); g.closePath(); g.fill(); g.restore();
}
function win(x, y, w, h, title, color = C.panel) {
  g.save(); g.shadowColor = 'rgba(0,0,0,.45)'; g.shadowBlur = 30; g.shadowOffsetY = 10;
  rr(x, y, w, h, 18, color); g.restore();
  rr(x, y, w, h, 18, null, C.line, 2);
  g.save(); g.beginPath(); g.roundRect(x, y, w, 52, [18, 18, 0, 0]); g.fillStyle = '#3a3833'; g.fill(); g.restore();
  ['#e46a6a', '#e8c26a', '#7cc47f'].forEach((c, i) => { g.beginPath(); g.arc(x + 30 + i * 26, y + 26, 8, 0, 7); g.fillStyle = c; g.fill(); });
  if (title) txt(title, x + w / 2, y + 27, 22, C.dim, 'center', MONO, '400');
}
function chip(s, x, y, size, bg, fg = C.bg, align = 'left') {
  const w = tw(s, size) + size * 1.1, h = size * 1.7;
  const x0 = align === 'center' ? x - w / 2 : align === 'right' ? x - w : x;
  rr(x0, y - h / 2, w, h, h / 2, bg); txt(s, x0 + w / 2, y + 1, size, fg, 'center');
  return w;
}
function ripple(x, y, k, color = C.yellow) {
  if (k <= 0 || k >= 1) return;
  g.save(); g.globalAlpha = 1 - k; g.strokeStyle = color; g.lineWidth = 6;
  g.beginPath(); g.arc(x, y, 14 + 50 * eo(k), 0, 7); g.stroke();
  g.globalAlpha = (1 - k) * .8; g.fillStyle = color; g.beginPath(); g.arc(x, y, 12, 0, 7); g.fill(); g.restore();
}
function finger(x, y, k) { // 指先のマーク
  if (k <= 0) return;
  g.save(); g.globalAlpha *= clamp(k * 3);
  g.beginPath(); g.arc(x, y, 16, 0, 7); g.fillStyle = 'rgba(255,255,255,.85)'; g.fill();
  g.lineWidth = 3; g.strokeStyle = C.bg; g.stroke(); g.restore();
}
function sparkle(x, y, s, a) {
  g.save(); g.translate(x, y); g.rotate(a); g.fillStyle = C.yellow;
  g.beginPath();
  for (let i = 0; i < 8; i++) { const r = i % 2 ? s * .3 : s; const t = i * Math.PI / 4; g.lineTo(Math.cos(t) * r, Math.sin(t) * r); }
  g.closePath(); g.fill(); g.restore();
}

// ---------- キャラクター（ドット絵） ----------
// 体 9x6 マス、左右に腕、下に脚4本。目は暗い四角。
function clawd(cx, by, u, st) {
  const t = st.t;
  const talk = st.amp || 0;
  const bob = Math.sin(t * 2.4) * u * .18 + (st.jump ? -Math.abs(Math.sin(t * 9)) * u * 1.6 * st.jump : 0);
  const sq = 1 + talk * .07;
  // 影
  g.save(); g.globalAlpha = .35; g.fillStyle = '#000';
  g.beginPath(); g.ellipse(cx, by + 4, u * 5.2 - bob * .3, u * .7, 0, 0, 7); g.fill(); g.restore();
  g.save(); g.translate(cx, by + bob);
  // 脚
  const legs = [-3.5, -1.5, 0.5, 2.5];
  legs.forEach((lx, i) => {
    const lift = st.walk ? Math.max(0, Math.sin(t * 10 + (i % 2) * Math.PI)) * u * .6 : 0;
    g.fillStyle = C.orange; g.fillRect(lx * u, -2 * u - lift, u, 2 * u);
  });
  g.translate(0, -2 * u); g.scale(1 / Math.sqrt(sq), sq);
  const bx = -4.5 * u, bt = -6 * u;
  // 腕（armL/armR: 0=下ろす 1=上げる）
  const arm = (side, k) => {
    const x = side < 0 ? bx - u : bx + 9 * u;
    const y = bt + 2.5 * u - k * 4 * u + (k > .5 ? Math.sin(t * 12) * u * .25 * (st.wave || 0) : 0);
    g.fillStyle = C.orange; g.fillRect(x, y, u, 2 * u);
  };
  arm(-1, st.armL || 0); arm(1, st.armR || 0);
  // 体
  g.fillStyle = C.orange; g.fillRect(bx, bt, 9 * u, 6 * u);
  g.fillStyle = 'rgba(255,255,255,.08)'; g.fillRect(bx, bt, 9 * u, u * .5);
  // 目
  const blink = (t % 3.7) < .12 ? .15 : 1;
  const lx = (st.look || 0) * u * .35, ly = (st.lookY || 0) * u * .3;
  g.fillStyle = C.bg;
  [-2.5, 1.5].forEach((ex) => {
    const x = ex * u + lx, y = bt + 1.6 * u + ly;
    if (st.mood === 'happy') {
      g.save(); g.strokeStyle = C.bg; g.lineWidth = u * .42; g.lineCap = 'square';
      g.beginPath(); g.moveTo(x - u * .1, y + u * 1.1); g.lineTo(x + u * .5, y + u * .35); g.lineTo(x + u * 1.1, y + u * 1.1); g.stroke(); g.restore();
    } else {
      const h = 1.6 * u * blink;
      g.fillRect(x, y + (1.6 * u - h) / 2, u, h);
    }
  });
  g.restore();
  // 表情の飾り（頭の上）
  const hx = cx + 3.6 * u, hy = by + bob - 9.2 * u;
  if (st.mood === 'sweat') {
    const k = (t * 1.3) % 1;
    g.save(); g.globalAlpha = 1 - k * .6; g.fillStyle = C.blue;
    const sx = cx + 5.2 * u, sy = by + bob - 7.4 * u + k * u * 1.2;
    g.beginPath(); g.moveTo(sx, sy - u * .9); g.quadraticCurveTo(sx + u * .7, sy + u * .1, sx, sy + u * .45);
    g.quadraticCurveTo(sx - u * .7, sy + u * .1, sx, sy - u * .9); g.fill(); g.restore();
  }
  if (st.emote) {
    const k = st.emoteK ?? 1;
    pop(k, hx, hy, () => {
      g.save(); g.fillStyle = C.text;
      g.beginPath(); g.arc(hx, hy, u * 1.35, 0, 7); g.fill();
      g.beginPath(); g.moveTo(hx - u * .9, hy + u * .8); g.lineTo(hx - u * 1.5, hy + u * 1.9); g.lineTo(hx - u * .1, hy + u * 1.2); g.fill();
      txt(st.emote, hx, hy + 2, u * 1.6, st.emote === '!' ? C.orange : st.emote === '?' ? C.blue : C.green, 'center', UI, '900');
      g.restore();
    });
  }
  if (st.mood === 'happy' || st.sparkle) {
    for (let i = 0; i < 4; i++) {
      const a = t * 1.5 + i * 1.6, r = u * (6.5 + Math.sin(t * 3 + i) * .6);
      const s = u * (.35 + .25 * Math.sin(t * 5 + i * 2) ** 2);
      sparkle(cx + Math.cos(a) * r * 1.1, by - 4.5 * u + Math.sin(a) * r * .75, s, t + i);
    }
  }
  // 持ち物
  if (st.prop) {
    const px = cx + 5.6 * u, py = by + bob - 2 * u - 6 * u + 2.5 * u - (st.armR || 0) * 4 * u;
    g.save(); g.translate(px, py);
    if (st.prop === 'glass') {
      g.rotate(-.5); g.strokeStyle = '#d9d4c7'; g.lineWidth = u * .45;
      g.beginPath(); g.arc(u * .9, -u * 1.6, u * 1.2, 0, 7); g.stroke();
      g.fillStyle = 'rgba(160,210,255,.25)'; g.fill();
      g.fillStyle = '#8a6a4a'; g.fillRect(u * .55, -u * .4, u * .6, u * 1.8);
    } else if (st.prop === 'wrench') {
      g.rotate(-.7); g.fillStyle = '#c9c4b8';
      g.fillRect(u * .2, -u * 2.8, u * .7, u * 3.2);
      g.beginPath(); g.arc(u * .55, -u * 3.1, u * .9, 0, 7); g.fill();
      g.fillStyle = C.bg; g.fillRect(u * .3, -u * 4.1, u * .5, u * 1);
    } else if (st.prop === 'flag') {
      g.fillStyle = '#d9d4c7'; g.fillRect(u * .3, -u * 4.5, u * .35, u * 5);
      g.fillStyle = C.green; g.beginPath(); g.moveTo(u * .65, -u * 4.5); g.lineTo(u * 3, -u * 3.7); g.lineTo(u * .65, -u * 2.9); g.fill();
    }
    g.restore();
  }
}

// ---------- 状態 ----------
let TL = null; // [{id,title,date,start,dur,voice,adur,subs,lineStarts}]
let TOTAL = 0;
window.setup = (timeline, total) => {
  TL = timeline; TOTAL = total;
  for (const s of TL) {
    const n = s.subs.reduce((a, l) => a + l.length, 0);
    let acc = 0; s.lineStarts = s.subs.map((l) => { const v = acc / n; acc += l.length; return v; });
  }
};

// ---------- 各シーンの絵 ----------
// v: ナレーションの進み具合（0〜1）、L: 字幕の各行が始まる v、lt: シーン内の秒
const SX = 640, SY = 150, SW = 1220, SH = 700; // 右のステージ
const V = {};

V.s00 = (v, L, lt) => {
  const cx = SX + SW / 2;
  appear(prog(lt, .1, .9), () => {
    txt('Claude Code と作る', cx, SY + 110, 46, C.orange2, 'center');
    txt('文字入れさん の作り方', cx, SY + 200, 92, C.text, 'center', UI, '900');
  });
  appear(prog(lt, .7, 1.5), () => txt('最近の指示と、そのときの試行錯誤', cx, SY + 290, 40, C.dim, 'center'));
  // 日付のタイムライン
  const x0 = SX + 90, x1 = SX + SW - 90, y = SY + 450;
  const k = eio(prog(v, .25, .85));
  g.strokeStyle = C.line; g.lineWidth = 6; g.beginPath(); g.moveTo(x0, y); g.lineTo(lerp(x0, x1, k), y); g.stroke();
  const pts = [['10/23', '最初のコミット', 0], ['11/5', '回答欄・ダブルタップ', .42], ['11/9', '文字数', .55], ['11/12', 'PDF・並べ替え', .65], ['11/16', '予測変換', .78], ['11/21', '数式キーボード', .95]];
  pts.forEach(([d, s, p], i) => {
    const kk = prog(k, p - .02, p + .08);
    pop(kk, lerp(x0, x1, p), y, () => {
      const x = lerp(x0, x1, p);
      g.beginPath(); g.arc(x, y, 14, 0, 7); g.fillStyle = i ? C.orange : C.dim; g.fill();
      txt(d, x, y - 42, 28, C.text, 'center');
      txt(s, x, y + (i % 2 ? 50 : 88), 22, C.dim, 'center');
    });
  });
  const stats = [['コミット', '54'], ['自動テスト', '167件'], ['コード', '約1.8万行']];
  stats.forEach(([a, b], i) => appear(prog(v, .55 + i * .08, .7 + i * .08), () => {
    const x = SX + 60 + i * 380, yy = SY + 640;
    rr(x, yy - 45, 350, 90, 20, C.panel, C.line, 2);
    txt(a, x + 24, yy, 24, C.dim); txt(b, x + 326, yy, 36, C.orange2, 'right', UI, '900');
  }));
};

V.s01 = (v, L) => {
  // 左：アプリの層
  appear(prog(v, 0, .08), () => {
    win(SX, SY + 10, 560, 600, 'ブラウザ');
    const x = SX + 40, y = SY + 90;
    rr(x, y, 480, 300, 8, C.paper);
    g.fillStyle = '#c9c3b5'; for (let i = 0; i < 6; i++) g.fillRect(x + 30, y + 40 + i * 42, i % 2 ? 260 : 380, 8);
    g.strokeStyle = C.ink; g.lineWidth = 2; g.strokeRect(x + 300, y + 200, 150, 60);
    appear(prog(v, .12, .2), () => txt('答え 42', x + 375, y + 231, 30, '#c0392b', 'center'));
    appear(prog(v, .15, .25), () => txt('x² + 1', x + 120, y + 270, 28, '#2b62c0', 'center', 'Cambria Math,serif', '400'));
  });
  const layers = [['React + TypeScript', '画面と操作', C.blue, .05], ['Konva', '画像に文字・数式を重ねる', C.orange, .15], ['IndexedDB', '端末の中だけに保存', C.green, .3]];
  layers.forEach(([a, b, c, p], i) => appear(prog(v, p, p + .08), () => {
    const y = SY + 430 + i * 58;
    rr(SX + 40, y, 480, 48, 10, c + '33', c, 2);
    txt(a, SX + 60, y + 25, 22, C.text); txt(b, SX + 500, y + 25, 18, C.dim, 'right');
  }));
  // 右：公開の流れ
  const bx = SX + 660, steps = [['git push', 'main ブランチへ', C.text], ['GitHub Actions', 'テスト → ビルド', C.yellow], ['GitHub Pages', '公開（自動）', C.green]];
  steps.forEach(([a, b, c], i) => {
    const k = prog(v, L[2] + i * .1, L[2] + i * .1 + .08);
    appear(k, () => {
      const y = SY + 60 + i * 220;
      rr(bx, y, 540, 140, 22, C.panel, c, 3);
      txt(a, bx + 40, y + 52, 40, c, 'left', MONO, '700'); txt(b, bx + 40, y + 102, 26, C.dim);
      if (i === 1) { check(bx + 420, y + 70, 24, prog(v, L[2] + .22, L[2] + .27)); check(bx + 480, y + 70, 24, prog(v, L[2] + .26, L[2] + .31)); }
      if (i === 2) check(bx + 480, y + 70, 28, prog(v, L[3] + .02, L[3] + .1));
    });
    if (i < 2) arrow(bx + 270, SY + 210 + i * 220, bx + 270, SY + 270 + i * 220, prog(v, L[2] + i * .1 + .06, L[2] + i * .1 + .12), C.dim);
  });
  // 流れる点
  const fk = prog(v, L[2], L[3] + .1);
  if (fk > 0 && fk < 1) { g.beginPath(); g.arc(bx + 520, SY + 130 + fk * 440, 10, 0, 7); g.fillStyle = C.orange; g.fill(); }
};

V.s02 = (v, L) => {
  const cx = SX + SW / 2, cy = SY + SH / 2 - 10, R = 270;
  const nodes = ['コードを読む', '原因の見当', '直す', 'テストを足す', 'ブラウザで確認', '公開', 'お知らせ'];
  const at = [L[0] + .05, L[1] + .0, L[1] + .12, L[1] + .22, L[2] + .02, L[2] + .2, L[3] + .05];
  pop(prog(v, 0, .06), cx, cy, () => {
    g.beginPath(); g.arc(cx, cy, 110, 0, 7); g.fillStyle = C.orange; g.fill();
    txt('指示', cx, cy - 14, 50, C.bg, 'center', UI, '900'); txt('（チャット）', cx, cy + 36, 22, C.bg, 'center');
  });
  let cur = -1; at.forEach((a, i) => { if (v >= a) cur = i; });
  // 円の軌道
  g.save(); g.setLineDash([10, 14]); g.strokeStyle = C.line; g.lineWidth = 4;
  g.beginPath(); g.arc(cx, cy, R, 0, 7); g.stroke(); g.restore();
  nodes.forEach((s, i) => {
    const a = -Math.PI / 2 + i * Math.PI * 2 / nodes.length;
    const x = cx + Math.cos(a) * R * 1.45, y = cy + Math.sin(a) * R * .98;
    const k = prog(v, at[i] - .03, at[i] + .04);
    pop(k, x, y, () => {
      const on = i === cur, w = tw(s, 30) + 60;
      rr(x - w / 2, y - 36, w, 72, 36, on ? C.yellow : C.panel, on ? C.yellow : C.line, 3);
      txt(s, x, y + 1, 30, on ? C.bg : C.text, 'center');
      chip(String(i + 1), x - w / 2 - 4, y - 34, 18, C.orange, C.bg, 'center');
    });
  });
};

V.s03 = (v, L, lt) => {
  // 左：縮小表示のスマホ
  const px = SX + 20, py = SY;
  appear(prog(v, 0, .06), () => {
    rr(px, py, 330, 640, 44, '#111', '#555', 4);
    rr(px + 18, py + 60, 294, 520, 12, C.paper);
    g.fillStyle = '#cfc9bb'; for (let i = 0; i < 9; i++) g.fillRect(px + 40, py + 100 + i * 50, i % 3 === 1 ? 120 : 230, 6);
    txt('問2', px + 50, py + 262, 16, C.ink); g.strokeStyle = C.ink; g.lineWidth = 2; g.strokeRect(px + 90, py + 252, 60, 18);
    txt('縮小表示', px + 165, py + 610, 22, C.dim, 'center');
    g.strokeStyle = C.yellow; g.lineWidth = 3; g.strokeRect(px + 84, py + 246, 72, 30);
  });
  arrow(px + 160, py + 261, SX + 420, SY + 260, prog(v, .1, .18), C.yellow, 4);
  // 右：拡大図
  const fx = SX + 620, fy = SY + 200, fw = 440, fh = 132;
  appear(prog(v, .12, .2), () => {
    rr(SX + 430, SY + 20, 780, 560, 24, C.panel, C.line, 2);
    txt('拡大すると…（画面上では 60×18px）', SX + 460, SY + 60, 26, C.dim);
    txt('問2', fx - 80, fy + fh / 2, 40, C.text, 'center');
    g.fillStyle = C.paper; g.fillRect(fx, fy, fw, fh);
    g.strokeStyle = C.ink; g.lineWidth = 4; g.strokeRect(fx, fy, fw, fh);
  });
  // 1回目のタップ → ハンドル
  const t1 = L[2] + .02, t2 = L[3] + .02;
  const tap1 = prog(v, t1, t1 + .06), sel = prog(v, t1 + .04, t1 + .08);
  finger(fx + fw / 2, fy + fh / 2, tap1 > 0 && v < t1 + .12 ? 1 : 0);

function terminal(lines, v0, v1, v, x, y, w, h, title) {
  win(x, y, w, h, title, '#191816');
  const n = lines.length;
  lines.forEach((ln, i) => {
    const k = prog(v, lerp(v0, v1, i / n), lerp(v0, v1, i / n) + .025);
    if (k <= 0) return;
    const yy = y + 90 + i * 44;
    const [kind, s] = ln;
    const col = kind === '$' ? C.text : kind === 'x' ? C.red : kind === 'o' ? C.green : kind === '!' ? C.yellow : C.dim;
    const pre = kind === '$' ? '$ ' : kind === 'x' ? '✗ ' : kind === 'o' ? '✓ ' : kind === '!' ? '⚠ ' : '→ ';
    const shown = (pre + s).slice(0, Math.ceil((pre + s).length * clamp(k * 1.2)));
    txt(shown, x + 34, yy, 25, col, 'left', MONO, kind === '$' ? '700' : '400');
  });
}

};

// キャラクターの動き（シーンごと）
function clawdState(id, v, L, lt) {
  const s = {};
  switch (id) {
    case 's00': s.armR = v < .35 ? 1 : 0; s.wave = 1; s.mood = v > .85 ? 'happy' : ''; break;
    case 's01': s.look = 1; s.armR = v > L[2] && v < L[3] + .15 ? 1 : 0; break;
    case 's02': s.look = 1; s.walk = v > .1 && v < .9; s.emote = v < .15 ? '!' : ''; s.emoteK = prog(v, 0, .05); break;
    case 's03': s.prop = 'glass'; s.armR = .6; s.look = 1;
      if (v < L[2]) { s.emote = '?'; s.emoteK = prog(v, .02, .08); } else if (v > L[3]) { s.emote = '!'; s.emoteK = prog(v, L[3], L[3] + .05); } break;
    case 's04': s.prop = 'wrench'; s.armR = .5 + .5 * Math.max(0, Math.sin(lt * 6)) * (v > .1 && v < .9 ? 1 : 0); s.look = 1;
      s.mood = v > .92 ? 'happy' : ''; break;
    case 's05': s.mood = v < .55 ? 'sweat' : v > .93 ? 'happy' : ''; s.look = 1; s.lookY = .5;
      if (v > .72 && v < .85) { s.emote = '?'; s.emoteK = prog(v, .72, .76); } if (v >= .85 && v < .93) { s.emote = '!'; s.emoteK = prog(v, .85, .88); } break;
    case 's06': s.mood = v > .1 && v < L[1] + .05 ? 'sweat' : v > L[3] + .2 ? 'happy' : ''; s.look = 1;
      if (v > .1 && v < L[1]) { s.emote = '!'; s.emoteK = prog(v, .1, .14); } break;
    case 's07': s.look = 1; s.prop = v > L[2] ? 'glass' : ''; s.armR = v > L[2] ? .6 : 0;
      if (v > L[1] + .14 && v < L[2]) { s.emote = '?'; s.emoteK = prog(v, L[1] + .14, L[1] + .18); }
      s.mood = v > L[3] + .05 ? 'happy' : ''; break;
    case 's08': s.look = 1; s.prop = 'wrench'; s.armR = .5; s.mood = (v > L[2] + .1 && v < L[3]) || v > .95 ? 'happy' : ''; break;
    case 's09': s.look = 1; if (v < L[1]) { s.emote = '?'; s.emoteK = prog(v, .02, .06); } else if (v < L[2] + .05) { s.emote = '!'; s.emoteK = prog(v, L[1], L[1] + .04); }
      s.mood = v > L[3] + .2 ? 'happy' : ''; break;
    case 's10': s.look = 1; if (v > L[1] && v < L[2]) s.mood = 'sweat'; if (v > L[3]) { s.emote = '✓'; s.emoteK = prog(v, L[3], L[3] + .05); } break;
    case 's11': s.prop = v > L[4] ? 'flag' : ''; s.armR = v > L[4] ? 1 : 0; s.armL = v > L[4] ? 1 : 0; s.mood = v > L[4] ? 'happy' : ''; s.jump = v > L[4] + .05 ? .6 : 0; break;
  }
  return s;
}

// 字幕の折り返し
function wrapLine(s, size, maxW) {
  if (tw(s, size) <= maxW) return [s];
  // 句読点・スペースのあたりで2行に分ける
  let best = Math.floor(s.length / 2), bestScore = 1e9;
  for (let i = 4; i < s.length - 4; i++) {
    const a = s.slice(0, i), b = s.slice(i);
    if (tw(a, size) > maxW || tw(b, size) > maxW) continue;
    const brk = '、。，」）) '.includes(s[i - 1]) ? 0 : 400;
    const sc = Math.abs(tw(a, size) - tw(b, size)) + brk;
    if (sc < bestScore) { bestScore = sc; best = i; }
  }
  return [s.slice(0, best), s.slice(best)];
}

function drawBg(t) {
  g.fillStyle = C.bg; g.fillRect(0, 0, W, H);
  g.fillStyle = 'rgba(255,255,255,.035)';
  for (let x = 30; x < W; x += 60) for (let y = 30; y < H; y += 60) g.fillRect(x - 1.5, y - 1.5, 3, 3);
  const gr = g.createRadialGradient(W / 2, H / 2, 300, W / 2, H / 2, 1200);
  gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,.45)');
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
}

window.frame = (t, amp) => {
  drawBg(t);
  let si = TL.length - 1;
  for (let i = 0; i < TL.length; i++) if (t < TL[i].start + TL[i].dur) { si = i; break; }
  const S = TL[si], lt = t - S.start;
  const v = clamp((lt - S.voice) / S.adur), L = S.lineStarts;
  // 上のタイトル
  if (S.id !== 's00') {
    const k = prog(lt, 0, .5);
    appear(k, () => {
      let x = 64;
      if (S.date) x += chip(S.date, x, 78, 28, C.orange) + 20;
      txt(S.title, x, 80, 46, C.text, 'left', UI, '900');
      txt(`${si} / ${TL.length - 1}`, W - 64, 80, 28, C.dim, 'right');
    }, -10);
    g.fillStyle = C.line; g.fillRect(64, 126, W - 128, 2);
  }
  // ステージ（入りと出のフェード）
  const fin = prog(lt, 0, .45), fout = 1 - prog(lt, S.dur - .35, S.dur);
  g.save(); g.globalAlpha = Math.min(fin, fout); g.translate(0, (1 - eo(fin)) * 20);
  V[S.id](v, L, lt);
  g.restore();
  // キャラクター
  const st = Object.assign({ t, amp }, clawdState(S.id, v, L, lt));
  clawd(330, 830, 26, st);
  // 字幕
  const bx = 60, by = 892, bw = W - 120, bh = 150;
  rr(bx, by, bw, bh, 26, 'rgba(15,14,13,.88)', C.line, 2);
  // しっぽ（キャラクターから）
  g.fillStyle = 'rgba(15,14,13,.88)'; g.beginPath(); g.moveTo(300, by + 1); g.lineTo(330, by - 26); g.lineTo(360, by + 1); g.fill();
  let li = -1; L.forEach((a, i) => { if (v >= a && lt >= S.voice) li = i; });
  if (lt > S.voice + S.adur + .5) li = -1;
  if (li >= 0) {
    const lines = wrapLine(S.subs[li], 38, bw - 80);
    const k = clamp((v - L[li]) * S.adur / .18);
    g.save(); g.globalAlpha = k;
    lines.forEach((s, i) => txt(s, bx + 40, by + bh / 2 + (i - (lines.length - 1) / 2) * 54, 38, C.text, 'left', UI, '700'));
    g.restore();
  }
  // 全体の進み
  g.fillStyle = C.line; g.fillRect(0, H - 6, W, 6);
  g.fillStyle = C.orange; g.fillRect(0, H - 6, W * t / TOTAL, 6);
  return cv.toDataURL('image/jpeg', 0.92);
};
