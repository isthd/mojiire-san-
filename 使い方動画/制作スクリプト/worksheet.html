<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<style>
  body { margin:0; background:#fff; }
  .sheet { width:1240px; height:1640px; box-sizing:border-box; padding:70px 90px; font-family:"Yu Mincho","MS Mincho",serif; color:#222; position:relative; }
  h1 { font-size:46px; margin:0 0 6px; letter-spacing:4px; }
  .sub { font-size:24px; color:#444; }
  .head { display:flex; align-items:flex-end; justify-content:space-between; border-bottom:4px double #222; padding-bottom:18px; }
  .name { font-size:28px; display:flex; align-items:flex-end; gap:12px; }
  .uline { display:inline-block; width:300px; border-bottom:3px solid #222; height:40px; }
  .q { margin-top:46px; font-size:30px; line-height:1.7; }
  .q b { font-family:"Yu Gothic","Meiryo",sans-serif; }
  .row { display:flex; align-items:center; gap:24px; margin-top:14px; }
  .box { border:3px solid #222; width:420px; height:86px; }
  .lab { font-size:26px; font-family:"Yu Gothic",sans-serif; }
  table { border-collapse:collapse; margin-top:14px; font-size:46px; font-weight:bold; }
  td, th { border:3px solid #222; width:190px; height:80px; text-align:center; }
  th { background:#fff; font-weight:normal; }
  .fig { display:flex; gap:60px; align-items:flex-start; }
  .tbox { border:3px solid #222; width:120px; height:420px; }
  .foot { position:absolute; bottom:50px; left:90px; right:90px; text-align:center; font-size:22px; color:#666; }
</style></head>
<body><div class="sheet">
  <div class="head">
    <div><h1>数学 確認プリント</h1><div class="sub">第3回　方程式と図形　　　　2年1組</div></div>
    <div class="name">名前 <span class="uline"></span></div>
  </div>

  <div class="q"><b>1</b>　次の方程式を解きなさい。
    <div class="row"><span>(1)　3x + 5 = 20</span><span style="flex:1"></span><span class="lab">答え</span><div class="box"></div></div>
    <div class="row"><span>(2)　x² − 5x + 6 = 0</span><span style="flex:1"></span><span class="lab">答え</span><div class="box"></div></div>
  </div>

  <div class="q"><b>2</b>　次の表を完成させなさい。（y = 2x + 1）
    <table>
      <tr><th>x</th><td>1</td><td>2</td><td>3</td><td>4</td></tr>
      <tr><th>y</th><td>3</td><td></td><td></td><td></td></tr>
    </table>
  </div>

  <div class="q"><b>3</b>　右の三角形で、∠x の大きさを求めなさい。
    <div class="fig">
      <svg width="560" height="380" viewBox="0 0 560 380">
        <polygon points="60,340 500,340 200,50" fill="none" stroke="#222" stroke-width="4"/>
        <text x="95" y="320" font-size="30">50°</text>
        <text x="420" y="320" font-size="30">60°</text>
        <text x="188" y="120" font-size="32" font-style="italic">x</text>
        <text x="30" y="370" font-size="26">A</text><text x="508" y="370" font-size="26">B</text><text x="192" y="38" font-size="26">C</text>
      </svg>
      <div><div class="lab" style="margin:8px 0">答え</div><div class="box" style="width:360px"></div>
        <div class="lab" style="margin:40px 0 8px">考え方</div><div class="box" style="width:360px;height:200px"></div></div>
    </div>
  </div>
  <div class="foot">— 裏面に続く —</div>
</div></body></html>
