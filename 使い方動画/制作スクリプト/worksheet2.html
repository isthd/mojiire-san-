<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<style>
  body { margin:0; background:#fff; }
  .sheet { width:1240px; height:1640px; box-sizing:border-box; padding:70px 90px; font-family:"Yu Mincho","MS Mincho",serif; color:#222; }
  h1 { font-size:46px; margin:0; letter-spacing:4px; border-bottom:4px double #222; padding-bottom:18px; }
  .q { margin-top:40px; font-size:30px; }
  .cols { display:flex; flex-direction:row-reverse; gap:40px; margin-top:30px; justify-content:center; }
  .col { display:flex; flex-direction:column; align-items:center; gap:14px; }
  .word { writing-mode:vertical-rl; font-size:40px; letter-spacing:8px; height:220px; }
  .tbox { border:3px solid #222; width:110px; height:340px; }
</style></head>
<body><div class="sheet">
  <h1>国語 漢字テスト</h1>
  <div class="q">次の――線の漢字の読みを、ひらがなで書きなさい。</div>
  <div class="cols">
    <div class="col"><div class="word">①　努力</div><div class="tbox"></div></div>
    <div class="col"><div class="word">②　季節</div><div class="tbox"></div></div>
    <div class="col"><div class="word">③　観察</div><div class="tbox"></div></div>
    <div class="col"><div class="word">④　貯金</div><div class="tbox"></div></div>
    <div class="col"><div class="word">⑤　景色</div><div class="tbox"></div></div>
  </div>
</div></body></html>
